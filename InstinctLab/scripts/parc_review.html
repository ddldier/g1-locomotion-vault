<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARC · 双手支撑动作审阅</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101923;color:#e7edf4}*{box-sizing:border-box}body{margin:0}header{padding:24px 28px 12px;border-bottom:1px solid #30404f}h1{font-size:25px;margin:0 0 8px}p{line-height:1.65;color:#b5c5d3;font-size:14px}main{display:grid;grid-template-columns:320px 1fr;min-height:76vh}aside{padding:18px;border-right:1px solid #30404f;max-height:85vh;overflow:auto}input,select,button{font:inherit;border:1px solid #456073;background:#1a2b3b;color:#e7edf4;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#304b61}input[type=search],select{width:100%;margin-bottom:12px}.clip{display:block;text-align:left;width:100%;margin:6px 0;padding:12px;overflow-wrap:anywhere;font-size:12px}.clip.active{border-color:#57c7fb;background:#244354}.badge{display:block;color:#86d9b4;margin-top:6px}article{padding:18px;min-width:0}canvas{display:block;width:100%;height:450px;background:#152433;border-radius:10px;touch-action:none}h2{font-size:18px;overflow-wrap:anywhere}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.controls select{width:auto;margin:0}#seek{width:100%;padding:0}#timeline{height:90px;margin-top:8px;border-radius:4px}.legend{display:flex;gap:18px;font-size:13px;margin:10px 0;color:#bdd0de}.legend b{color:#55c6ff}.legend em{color:#ff829f;font-style:normal}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#1c2d3c;border-radius:7px;padding:12px;font-size:13px;color:#b8ccda}.metric strong{display:block;color:#fff;font-size:18px;margin-top:5px}#notes{padding:12px;background:#22303b;border-left:3px solid #efbe60;white-space:pre-line}small{color:#91a8ba}#source{overflow-wrap:anywhere;font-size:12px}a{color:#73d1f9}@media(max-width:850px){main{grid-template-columns:1fr}aside{max-height:240px;border-right:0}canvas{height:360px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>PARC · 双手支撑动作审阅</h1><p>从已下载动作中筛选：双手接触 → 脚离地 → 身体越过 → 落地。分类仅用于初筛，不能证明动作符合撑箱要求。展示原始人体与高度场，尚未重定向到 G1。</p></header>
<main><aside><input id="search" type="search" placeholder="搜索动作名"><select id="category"><option value="">全部候选类型</option></select><small id="count"></small><div id="list"></div><p>此页展示各类代表候选（每个增强家族最多两条）。全部结果见同目录 candidates.csv 与 index.jsonl。</p><button id="export">导出本页人工审阅记录</button></aside>
<article><h2 id="title">加载中</h2><canvas id="scene"></canvas><div class="legend"><span><b>●</b> 右侧</span><span><em>●</em> 左侧</span><span style="color:#ffda78">● 躯干</span><span style="color:#79f7b5">◎ 接触标记</span><span>拖动旋转 · 滚轮缩放</span></div>
<div class="controls"><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="event">跳到支撑前</button><button id="reset">重置视角</button><select id="speed"><option value=".25">¼ 速</option><option value=".5" selected>½ 速</option><option value="1">原速</option></select><label><input id="follow" type="checkbox" checked>跟随人体</label><span id="time"></span></div>
<input id="seek" type="range" min="0" max="1" step="1" value="0"><canvas id="timeline"></canvas><p>接触时间线：右手、左手、右脚、左脚。绿色表示原始标记为接触；点击可跳转。</p>
<div class="metrics" id="metrics"></div><p id="notes"></p><div class="controls"><label for="review">人工判断</label><select id="review"><option value="unreviewed">未审阅</option><option value="vault">符合：双手支撑翻越</option><option value="platform">撑上平台／攀爬</option><option value="jump">先跳跃／后撑手</option><option value="reject">不适合／动作异常</option><option value="uncertain">仍不确定</option></select></div><p id="source"></p></article></main>
<script id="payload" type="application/json">__DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent), $=id=>document.getElementById(id);
let current=null,frame=0,playing=false,angle=-.95,elevation=.4,zoom=1,triangles=[],annotations={};
try{annotations=JSON.parse(localStorage.getItem('parc-review-v1')||'{}')}catch(e){}
for(const [key,label] of Object.entries(data.labels)){const o=document.createElement('option');o.value=key;o.textContent=label;$('category').append(o)}
function listing(){const q=$('search').value.toLowerCase(),cat=$('category').value;const clips=data.clips.filter(c=>c.clip.toLowerCase().includes(q)&&(!cat||c.category===cat));$('count').textContent=`当前 ${clips.length} / ${data.clips.length} 条`;$('list').replaceChildren();for(const c of clips){const b=document.createElement('button');b.className='clip'+(c===current?' active':'');b.textContent=c.clip;const s=document.createElement('span');s.className='badge';s.textContent=data.labels[c.category];b.append(s);b.onclick=()=>choose(c);$('list').append(b)}}
function metric(label,value){const el=document.createElement('div');el.className='metric';el.textContent=label;const strong=document.createElement('strong');strong.textContent=value;el.append(strong);$('metrics').append(el)}
const fixed=(v,suffix='')=>v==null?'未知':v.toFixed(2)+suffix;
function choose(c){current=c;playing=false;frame=Math.max(0,c.best_event.start_frame-Math.round(c.fps*.4));$('play').textContent='播放';$('title').textContent=c.clip;$('seek').max=c.frames-1;$('review').value=annotations[c.clip]||'unreviewed';$('metrics').replaceChildren();const e=c.best_event;
metric('初筛分类',data.labels[c.category]);metric('连续双手接触',fixed(e.duration_s,' 秒'));metric('双手接触且双脚离地',fixed(e.airborne_overlap_s,' 秒'));metric('支撑面相对接近地面高度',fixed(e.support_height_above_approach_m,' 米'));metric('手节点与地形高度差中位数',fixed(e.hand_surface_error_m,' 米'));metric('落地面高度变化',fixed(e.landing_height_change_m,' 米'));
$('notes').textContent=`${e.support_before_air?'检测到支撑期间从有脚接触转为双脚离地。':'未确认先支撑后离地的时序。'}\n${e.landed_beyond?'落地时骨盆已越过手部支撑位置的投影。':'未确认落地时身体已越过支撑位置。'}\n注意：接触标记不包含接触力或接触对象；节点不等于手掌/脚底表面。几何阈值与粗糙高度场会产生误判，请完整回放确认。`;
$('source').textContent='来源：'+c.source+' · 地形：'+(c.terrain_obj_present?'OBJ 已下载':'OBJ 暂缺，使用 pkl 高度场');
triangles=[];if(c.terrain){const {hf,dx,min_point:m}=c.terrain;for(let i=0;i<hf.length-1;i++)for(let j=0;j<hf[0].length-1;j++){const p=(a,b)=>[m[0]+a*dx,m[1]+b*dx,hf[a][b]];triangles.push([p(i,j),p(i+1,j),p(i+1,j+1)],[p(i,j),p(i+1,j+1),p(i,j+1)])}}listing();draw()}
function dimensions(canvas){const d=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}const ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);return[ctx,w,h]}
function draw(){if(!current)return;const c=current,p=c.positions[frame];const [ctx,w,h]=dimensions($('scene'));const center=$('follow').checked?[p[0][0],p[0][1],p[0][2]-.25]:c.positions[c.best_event.start_frame][0];const scale=Math.min(w/6,h/4)*zoom;
function project(a){const x=a[0]-center[0],y=a[1]-center[1],z=a[2]-center[2],u=Math.cos(angle)*x-Math.sin(angle)*y,v=Math.sin(angle)*x+Math.cos(angle)*y;return[w/2+u*scale,h*.54-(z*Math.cos(elevation)-v*Math.sin(elevation))*scale,v*Math.cos(elevation)+z*Math.sin(elevation)]}
const primitives=[];
for(const t of triangles){const mean=t.reduce((s,v)=>[s[0]+v[0]/3,s[1]+v[1]/3,s[2]+v[2]/3],[0,0,0]);if(Math.hypot(mean[0]-center[0],mean[1]-center[1])>6/zoom)continue;const points=t.map(project);primitives.push({kind:'triangle',points,depth:points.reduce((s,v)=>s+v[2]/3,0),height:mean[2]})}
for(let j=1;j<15;j++){const points=[project(p[c.parents[j]]),project(p[j])];primitives.push({kind:'bone',points,depth:(points[0][2]+points[1][2])/2,color:j<3?'#ffda78':[3,4,5,9,10,11].includes(j)?'#55c6ff':'#ff829f'})}
for(const j of [5,8,11,14])if(c.contacts[frame][j]){const v=project(p[j]);primitives.push({kind:'contact',points:[v],depth:v[2]-.005})}
primitives.sort((a,b)=>b.depth-a.depth);
for(const o of primitives){ctx.beginPath();const pts=o.points;ctx.moveTo(pts[0][0],pts[0][1]);if(o.kind==='triangle'){ctx.lineTo(pts[1][0],pts[1][1]);ctx.lineTo(pts[2][0],pts[2][1]);ctx.closePath();ctx.fillStyle='rgba(129,157,177,.66)';ctx.fill();ctx.strokeStyle='rgba(35,61,78,.55)';ctx.lineWidth=.5;ctx.stroke()}else if(o.kind==='bone'){ctx.lineTo(pts[1][0],pts[1][1]);ctx.strokeStyle=o.color;ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.arc(pts[1][0],pts[1][1],3,0,2*Math.PI);ctx.fillStyle=o.color;ctx.fill()}else{ctx.arc(pts[0][0],pts[0][1],9,0,2*Math.PI);ctx.strokeStyle='#79f7b5';ctx.lineWidth=3;ctx.stroke()}}
ctx.fillStyle='#d3e0eb';ctx.font='13px system-ui';ctx.fillText('人体骨架 · 原始地形 · 单位：米',16,25);$('time').textContent=`${(frame/c.fps).toFixed(2)} / ${c.duration_s.toFixed(2)} 秒 · 帧 ${frame}`;$('seek').value=frame;timeline()}
function timeline(){const [ctx,w,h]=dimensions($('timeline'));const labels=['右手','左手','右脚','左脚'],joints=[5,8,11,14],left=48,usable=w-left;ctx.font='12px system-ui';for(let row=0;row<4;row++){const y=7+row*20;ctx.fillStyle='#b7cbda';ctx.fillText(labels[row],5,y+11);ctx.fillStyle='#22394b';ctx.fillRect(left,y,usable,13);ctx.fillStyle='#64d8a4';for(let t=0;t<current.frames;t++)if(current.contacts[t][joints[row]])ctx.fillRect(left+t/current.frames*usable,y,Math.max(1,usable/current.frames),13)}ctx.strokeStyle='#ffdf90';ctx.lineWidth=2;const x=left+frame/current.frames*usable;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
$('search').oninput=listing;$('category').onchange=listing;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
function step(n){playing=false;$('play').textContent='播放';frame=Math.max(0,Math.min(current.frames-1,frame+n));draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('seek').oninput=()=>{frame=Number($('seek').value);step(0)};$('event').onclick=()=>{frame=Math.max(0,current.best_event.start_frame-Math.round(.4*current.fps));step(0)};$('follow').onchange=draw;$('reset').onclick=()=>{angle=-.95;elevation=.4;zoom=1;draw()};
$('timeline').onclick=e=>{frame=Math.max(0,Math.min(current.frames-1,Math.floor((e.offsetX-48)/($('timeline').clientWidth-48)*current.frames)));step(0)};
let drag=null;$('scene').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('scene').setPointerCapture(e.pointerId)};$('scene').onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.008;elevation=Math.max(.05,Math.min(1.45,elevation+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};$('scene').onpointerup=()=>drag=null;$('scene').onpointercancel=()=>drag=null;$('scene').addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
$('review').onchange=()=>{annotations[current.clip]=$('review').value;try{localStorage.setItem('parc-review-v1',JSON.stringify(annotations))}catch(e){}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:1,reviewed_at:new Date().toISOString(),reviews:annotations},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parc_manual_reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
let last=0,acc=0;function tick(now){if(playing&&current){acc+=Math.min((now-last)/1000,.2)*Number($('speed').value)*current.fps;if(acc>=1){frame=(frame+Math.floor(acc))%current.frames;acc%=1;draw()}}else acc=0;last=now;requestAnimationFrame(tick)}
window.addEventListener('resize',draw);listing();if(data.clips.length)choose(data.clips[0]);else $('title').textContent='本次扫描尚无可预览候选';requestAnimationFrame(tick);
</script></body></html>
