seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 1001
ckpt_manipulator: null
policy:
  class_name: ActorCritic
  init_noise_std: 0.2
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: WarmStartPPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.1
  entropy_coef: 0.0
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  optimizer_class_name: Adam
  schedule: fixed
  gamma: 0.995
  lam: 0.95
  advantage_mixing_weights: 1.0
  desired_kl: null
  max_grad_norm: 1.0
  clip_min_std: 1.0e-12
  critic_only: true
  actor_learning_rate: 3.0e-05
  critic_learning_rate: 0.0003
save_interval: 10
log_interval: 1
experiment_name: g1_unified_transition_ppo
run_name: critic_warmup
resume: true
load_run: /root/gpufree-data/InstinctLab/logs/instinct_rl/g1_unified_transition_ppo_xonly_no_upright/20261104_154802_g1_unified_transition_ppo_critic_warmup
load_checkpoint: model_501.pt
normalizers:
  policy:
    class_name: EmpiricalNormalization
  critic:
    class_name: EmpiricalNormalization
